# MultiQC configuration for QuIVER pipeline
# Used by the MULTIQC Nextflow module (modules/local/multiqc.nf).
#
# MultiQC version: 1.25.1 (quay.io/biocontainers/multiqc:1.25.1--pyhdfd78af_0)
# See CLAUDE.md Section 4 for pinned versions.

title: "QuIVER pipeline QC report"
subtitle: "HCV quasispecies pipeline — per-run aggregate quality control"
intro_text: >
    This report was generated automatically by the QuIVER pipeline.
    It aggregates QC metrics from NanoPlot (raw read quality), mosdepth
    (coverage), samtools flagstat (mapping rates), and bcftools stats
    (variant call quality) across all samples in this run.

# Report filename
output_fn_name: multiqc_report.html

# Keep report data directory
data_dir_name: multiqc_data

# Force overwrite of existing report
force: true

# Log level
log_filesize_limit: 500000000  # 500 MB — large HCV runs may have big logs

# ── Module selection ─────────────────────────────────────────────────────────
# Only run parsers relevant to QuIVER outputs.  This keeps the report
# focused and avoids false-positive parsing of unrelated files in the work dir.
run_modules:
    - nanoplot
    - mosdepth
    - samtools
    - bcftools

# ── Module configuration ─────────────────────────────────────────────────────
module_order:
    - nanoplot:
        name: "NanoPlot (raw read quality)"
        info: "Read length and quality metrics from raw ONT reads before filtering."
        path_filters:
            - "*/NanoStats.txt"
    - mosdepth:
        name: "mosdepth (coverage)"
        info: "Per-genotype coverage depth from Round 2 BAM alignments."
        path_filters:
            - "*.mosdepth.summary.txt"
    - samtools:
        name: "samtools flagstat (mapping)"
        info: "Mapping statistics from Round 2 alignment to per-genotype consensus."
        path_filters:
            - "*.flagstat"
    - bcftools:
        name: "bcftools stats (variants)"
        info: "Variant call statistics from LoFreq VCF."
        path_filters:
            - "*.bcftools_stats.txt"

# ── Custom content ───────────────────────────────────────────────────────────
# Link back to the per-run HTML summary generated by render_run_summary.py
custom_logo: null  # can be set to a base64-encoded PNG for institutional branding

# ── Search patterns ──────────────────────────────────────────────────────────
# Ensure MultiQC correctly identifies NanoPlot tsv_stats output.
sp:
    nanoplot:
        fn: "NanoStats.txt"

# ── Table customisation ──────────────────────────────────────────────────────
table_columns_visible:
    NanoPlot:
        number_of_reads: True
        number_of_bases: True
        median_read_length: True
        mean_read_length: True
        read_length_stdev: False
        n50: True
        mean_qual: True
        median_qual: True
    mosdepth-coverage:
        mean_coverage: True
        min_coverage: False
        max_coverage: False
    samtools-flagstat:
        flagstat_total: True
        primary_mapped_pct: True

table_columns_name:
    NanoPlot:
        number_of_reads:   "Reads"
        number_of_bases:   "Bases"
        median_read_length: "Median Length"
        mean_read_length:  "Mean Length"
        n50:               "Read N50"
        mean_qual:         "Mean Q"
        median_qual:       "Median Q"
    mosdepth-coverage:
        mean_coverage: "Mean Depth"
    samtools-flagstat:
        flagstat_total:     "Total Reads"
        primary_mapped_pct: "Mapped %"

# ── Report colours ───────────────────────────────────────────────────────────
custom_plot_config:
    mosdepth_coverage_dist_id:
        ylab: "Coverage depth (x)"
        xlab: "Fraction of genome"

# ── Ignore patterns ──────────────────────────────────────────────────────────
# Exclude Nextflow work directory files from MultiQC search to avoid confusion.
fn_ignore_dirs:
    - "work"
    - ".nextflow"

fn_ignore_files:
    - "*.command.*"
    - ".command.*"
    - "*.trace"
