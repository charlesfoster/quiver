name: Build containers

on:
  push:
    paths:
      - 'containers/**'
  pull_request:
    paths:
      - 'containers/**'
  workflow_dispatch:

jobs:
  build-devider:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only push on non-PR events and when the secret is available.
        # For pull requests the image is built and smoke-tested but not pushed.
        if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build DEVIDER image (amd64 + arm64)
        # linux/arm64 added as a secondary platform.  The Dockerfile uses only
        # stock Rust and Debian base images which are both multi-arch, so the
        # cross-compilation succeeds without any changes to the Dockerfile.
        # Build cache uses GitHub Actions cache (type=gha) to speed up re-runs.
        uses: docker/build-push-action@v5
        with:
          context: containers/devider
          platforms: linux/amd64,linux/arm64
          # Push only on non-PR events; on PRs just build to validate.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/devider:0.0.1
            ghcr.io/${{ github.repository_owner }}/devider:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Load the image into the local Docker daemon so the smoke test can
          # run it.  load: true is incompatible with multi-platform push, so we
          # build a second amd64-only image for the smoke test below.

      - name: Build DEVIDER image (amd64 only, for smoke test)
        # docker/build-push-action with push:false and a single platform loads
        # the image into the local daemon, enabling `docker run` below.
        uses: docker/build-push-action@v5
        with:
          context: containers/devider
          platforms: linux/amd64
          push: false
          load: true
          tags: hcv-quasi/devider:smoke
          cache-from: type=gha

      - name: Smoke test — devider --help exits 0
        # Verifies the binary is present, executable, and prints a help message.
        # DEVIDER v0.0.1 exits 0 for --help; update this assertion if a newer
        # release changes the exit code.
        run: |
          docker run --rm --platform linux/amd64 hcv-quasi/devider:smoke --help
